@if (visible()) {
  <div
    class="flex items-center gap-2 bg-[var(--ion-color-warning)] px-screen-x py-2 text-small text-[var(--ion-color-warning-contrast)]"
    role="status"
  >
    <ion-icon [name]="icon" class="shrink-0 text-lg" aria-hidden="true" />
    <span>{{ message() }}</span>
  </div>
}
